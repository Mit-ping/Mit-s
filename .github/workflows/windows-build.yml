name: Mit's VPN Windows beta (artifacts only)

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-1.5-beta

permissions:
  contents: read

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CHANNEL: prod
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Configure package cache
        run: echo "PUB_CACHE=$(cygpath -m "$RUNNER_TEMP")/pub-cache" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install make innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore Dart package cache
        id: pub-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: windows-beta-dart-3.10.4-${{ hashFiles('pubspec.lock') }}

      - name: Install Dart dependencies
        id: dependencies
        run: |
          set -euo pipefail
          flutter config --no-analytics --enable-windows-desktop
          flutter pub get --enforce-lockfile
          make windows-install-deps
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"

      - name: Validate installer executable selection
        run: dart --packages="$PUB_CACHE/global_packages/fastforge/.dart_tool/package_config.json" .github/scripts/check_windows_installer_config.dart

      - name: Generate sources
        run: |
          set -euo pipefail
          make gen translate

      - name: Prepare verified Windows VPN core
        run: |
          set -euo pipefail
          # Pinned source rebuild with locale-neutral Windows service permissions.
          # Provenance and reviewed patches are in vendor/windows/.
          archive="$PWD/vendor/windows/vpn-core.tar.gz"
          echo "2c5820251029ecfdaedc91c197d48c4cbaae277f62187d3579d0322eb3579bd6  $archive" | sha256sum --check -
          mkdir -p hiddify-core/bin
          tar -xzf "$archive" -C hiddify-core/bin
          for file in hiddify-core.dll libcronet.dll HiddifyCli.exe HiddifyAdmin.exe; do
            test -s "hiddify-core/bin/$file"
          done
          cp hiddify-core/bin/* hiddify-core/
          echo "$(cygpath -m "$PWD/hiddify-core")" >> "$GITHUB_PATH"

      - name: Verify localized Windows service and real TUN traffic
        shell: pwsh
        run: |
          $group = Get-LocalGroup -SID 'S-1-5-32-544'
          $originalName = $group.Name
          try {
            Rename-LocalGroup -SID 'S-1-5-32-544' -NewName 'Администраторы VPN'
            ./windows/scripts/smoke_test_vpn_service.ps1 -CoreDirectory hiddify-core/bin
          } finally {
            Rename-LocalGroup -SID 'S-1-5-32-544' -NewName $originalName
          }

      - name: Analyze and test
        env:
          MIT_REQUIRE_AWG_NATIVE_TESTS: 'true'
          MIT_NATIVE_TEST_DIRECTORY: ${{ runner.temp }}/mit-native-tests
        run: |
          set -euo pipefail
          native_fixture="$(cygpath -u "$MIT_NATIVE_TEST_DIRECTORY")"
          mkdir -p "$native_fixture"
          trap 'rm -rf "$native_fixture"' EXIT
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build portable ZIP
        run: make windows-zip-release

      - name: Build Setup EXE
        run: make windows-exe-release

      - name: Collect Windows downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $targets = @{
            '.exe' = 'MitsVPN-1.5.0-beta.4-Windows-x64-Setup.exe'
            '.zip' = 'MitsVPN-1.5.0-beta.4-Windows-x64-Portable.zip'
          }
          foreach ($extension in $targets.Keys) {
            $files = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -eq $extension })
            if ($files.Count -ne 1) { throw "Expected one $extension package, found $($files.Count)" }
            if ($files[0].Length -eq 0) { throw "Empty package: $($files[0].FullName)" }
            Copy-Item $files[0].FullName (Join-Path out $targets[$extension])
          }
          $setup = Get-Item out/MitsVPN-1.5.0-beta.4-Windows-x64-Setup.exe
          @{
            schema = 1; app_id = 'com.mitsvpn.app'; platform = 'windows'; architecture = 'x64'
            version = '1.5.0-beta.4'; build_number = 10503
            setup_filename = $setup.Name; setup_size = $setup.Length
            setup_sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content out/mits-vpn-windows-update.json -Encoding utf8
          Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content out/SHA256SUMS.txt -Encoding ascii

      - name: Verify portable application starts
        shell: pwsh
        run: ./windows/scripts/smoke_test_windows.ps1 -Archive out/MitsVPN-1.5.0-beta.4-Windows-x64-Portable.zip -Screenshot out/MitsVPN-Windows-preview.png

      - name: Verify installed application and desktop shortcut
        shell: pwsh
        run: ./windows/scripts/smoke_test_installer.ps1 -Setup out/MitsVPN-1.5.0-beta.4-Windows-x64-Setup.exe -OutputDirectory out/installer-check

      - name: Upload Windows diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: MitsVPN-Windows-diagnostics
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: MitsVPN-1.5.0-beta.4-Windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Save verified Dart dependencies
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.pub-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: windows-beta-dart-3.10.4-${{ hashFiles('pubspec.lock') }}
