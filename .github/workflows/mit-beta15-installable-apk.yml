name: Mit VPN Beta 1.5 debug APK
on:
  push:
    paths: ['.github/workflows/mit-beta15-installable-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 92e2a7bd653eb7ece187407781a9a8d3d7637ee2
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          make android-libs SHELL=/bin/bash '.SHELLFLAGS=-euo pipefail -c'
      - name: Build installable debug APK
        run: |
          flutter build apk --debug --dart-define=ONE_TAP_VPN=true --build-name=1.5.0-beta --build-number=50005
          python3 .github/scripts/check_mit_branding.py build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-debug.apk apk/mits-vpn-beta-1.5-debug.apk
          cd apk
          sha256sum mits-vpn-beta-1.5-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mits-vpn-beta-1.5-debug
          path: apk/
          if-no-files-found: error
          retention-days: 30
