name: Verify Android signing secrets (existing APK)

on:
  push:
    branches: [build/android-signing-check]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-signing-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN: '42784701948'
      SOURCE_COMMIT: '1789809dcdea736ff5bebe52d9f63d4320f6998d'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Verify the original build passed all application checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((directory / 'source-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GH_REPO'] == 'Mit-ping/Mit-s'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['path'] == '.github/workflows/android-one-tap.yml'
          assert run['status'] == 'completed'
          jobs = json.loads((directory / 'source-jobs.json').read_text())['jobs']
          build = [job for job in jobs if job['name'] == 'test-and-apk']
          assert len(build) == 1 and build[0]['conclusion'] == 'success'
          print('Original build, tests and packaged identity checks verified.')
          PY

      - name: Verify application inputs have not changed since that build
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          if ! git diff --quiet "$SOURCE_COMMIT" HEAD -- lib android assets pubspec.yaml pubspec.lock build.yaml Makefile .github/workflows/android-one-tap.yml ':!android/mit-signing-cert.sha256'; then
            echo 'Application inputs changed: build a new APK instead of signing this artifact.'
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42784701948
          name: mits-vpn-unsigned-1789809dcdea736ff5bebe52d9f63d4320f6998d
          path: unsigned

      - name: Verify the exact tested APK checksum
        working-directory: unsigned
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          echo '9ebf40b0177a202e8a27d21b1600c389ae180ad6e4e31c6213b25dbc7ec6477f  mits-vpn-unsigned.apk' | sha256sum --check -

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Sign using the configured secrets and verify the new certificate
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: python3 .github/scripts/sign_mit_beta.py

      - name: Include the public certificate fingerprint
        run: cp android/mit-signing-cert.sha256 signed/certificate-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MitsVPN-Android-50006-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30
