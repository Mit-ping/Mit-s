name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    # Same grant as ci.yml: with the narrowed block below GITHUB_TOKEN got
    # "Resource not accessible by integration" (403) from the create-release API
    # on the v5.2.0 run. Jobs inside build.yml still restrict their own scopes.
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ github.ref_name }}"
      channel: "${{ github.ref_type == 'tag' && endsWith(github.ref_name, 'dev') && 'dev' || github.ref_type != 'tag' && 'dev' || 'prod' }}"
